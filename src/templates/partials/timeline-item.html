<div class="row d-block d-md-flex{{#unless @last}} mb-5{{/unless}}">
    <div class="col-md-1 d-none d-md-block">
        <a href="{{ link }}"><img src="{{ logo }}" class="img-fluid bouncing-image" alt="{{ title }} logo"></a>
    </div>
    <div class="col-md-10">
        <h3 class="fs-4 fw-bold">{{ title }}</h3>
        <h5 class="fs-5 fw-normal grey">{{ subtitle }}</h5>
        <h5 class="fs-6 fw-normal grey">{{ period }}</h5>
        {{#if location}}
        <h5 class="fs-6 fw-normal grey">{{ location }}</h5>
        {{/if}}
        {{> @partial-block }}
        <p>
            {{#each skills}}
            <span class="badge text-body border border-1">{{ this }}</span>
            {{/each}}
        </p>
    </div>
</div>
